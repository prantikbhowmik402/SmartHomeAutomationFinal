<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Smart Home</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="login-container">
    <h2>Welcome to Smart Home</h2>

    <div id="form-toggle">
      <button onclick="showLogin()" class="active-tab">Login</button>
      <button onclick="showSignup()">Signup</button>
    </div>

    <form id="loginForm" class="auth-form">
      <label>Email</label>
      <input type="email"    id="loginEmail"    placeholder="Enter your email"    required />
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" required />
      <button type="submit">Login</button>
    </form>

    <form id="signupForm" class="auth-form" style="display: none;">
      <label>Full Name</label>
      <input type="text"     id="signupName"     placeholder="Your full name"      required />
      <label>Email</label>
      <input type="email"    id="signupEmail"    placeholder="Enter your email"    required />
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Create a password (min 6 chars)" required />
      <button type="submit">Signup</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
